[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | __pycache__
  | migrations
  | \.pytest_cache
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_django = ["django", "rest_framework", "rest_framework_simplejwt", "drf_spectacular"]
known_first_party = ["users", "notes", "labels", "common", "collab_service"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "DJANGO", "FIRSTPARTY", "LOCALFOLDER"]
skip_glob = ["*/migrations/*", "*/.venv/*", "*/venv/*"]
