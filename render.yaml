services:
  # ── Django web service ───────────────────────────────────────────────────────
  - type: web
    name: fundoonotes-django
    runtime: python
    rootDir: fundoonotes
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: gunicorn fundoonotes.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/schema/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: fundoonotes.settings
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Set these in the Render dashboard — do not hardcode secrets here
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: noreply@fundoonotes.com
      - key: JWT_ACCESS_MINUTES
        value: "60"
      - key: JWT_REFRESH_DAYS
        value: "7"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CHATBOT_OPENROUTER_API_KEY
        sync: false

  # ── Celery worker ────────────────────────────────────────────────────────────
  - type: worker
    name: fundoonotes-celery
    runtime: python
    rootDir: fundoonotes
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A fundoonotes.celery worker --loglevel=info
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: fundoonotes.settings
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

  # ── FastAPI collab service ───────────────────────────────────────────────────
  - type: web
    name: fundoonotes-collab
    runtime: python
    rootDir: collab_service
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: CORS_ALLOWED_ORIGINS
        sync: false
